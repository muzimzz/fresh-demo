# 운영 배포용 프로필. 배포 환경에서 SPRING_PROFILES_ACTIVE=prod를 명시적으로 지정해야 적용된다.

jwt:
  cookie:
    # 운영은 반드시 HTTPS 뒤에서 떠야 한다 — Secure가 꺼진 채로 배포되면 accessToken/refreshToken
    # 쿠키가 평문 HTTP 구간에서도 오갈 수 있다(MITM 위험). 그래도 혹시 모를 예외 상황을 위해
    # 환경변수로 재정의할 여지는 남겨두되, 기본값 자체는 안전한 쪽(true)으로 둔다.
    secure: ${JWT_COOKIE_SECURE:true}
